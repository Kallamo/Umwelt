# SPDX-License-Identifier: AGPL-3.0-only
# cargo-about: the licenses of the crates shipped inside the umwelt executable
# and the native library, gathered into THIRD-PARTY-NOTICES.txt at release
# time (see .github/workflows/release.yml). The accepted list matches
# deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]
# Only what ships: not tests, not build scripts' tools, not Umwelt's own crates.
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
